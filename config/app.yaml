# Application config. Secrets never go here — only names of env vars that hold them.

# Providers the chain can use. Any OpenAI-compatible API needs only a new entry here.
providers:
  openrouter:
    type: openai-compatible
    baseUrl: https://openrouter.ai/api/v1
    apiKeyEnv: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: https://github.com/vovka/etymology_bot
      X-Title: Etymology Bot
  groq:
    type: openai-compatible
    baseUrl: https://api.groq.com/openai/v1
    apiKeyEnv: GROQ_API_KEY

# Tried top to bottom. A rate-limited model is skipped until its cooldown ends.
# Free model IDs change often: check https://openrouter.ai/models?max_price=0 and https://console.groq.com/docs/models
modelChain:
  - provider: groq
    model: openai/gpt-oss-120b
    extraBody:
      reasoning_effort: low
  - provider: openrouter
    model: google/gemma-4-31b-it:free
  - provider: groq
    model: openai/gpt-oss-20b
    extraBody:
      reasoning_effort: low
  - provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free
  - provider: openrouter
    model: google/gemma-4-26b-a4b-it:free
  - provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
  - provider: openrouter
    model: poolside/laguna-s-2.1:free
  - provider: openrouter
    model: thinkingmachines/inkling:free
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
  - provider: openrouter
    model: openrouter/free

llm:
  # Keep research.timeoutMs + requestTimeoutMs × chain length under maxDuration (120s in vercel.json).
  requestTimeoutMs: 25000
  maxTokens: 2500
  temperature: 0.3

cooldown:
  # Used when the provider sends no Retry-After header. A chain entry may override with cooldownSeconds.
  defaultSeconds: 60
  # Used when the error says a daily quota is exhausted.
  dailyQuotaSeconds: 3600

# Reference sources fetched before the model writes, so answers cite real scholarship.
# Etymonline has no API: it is read from its web page, so drop it here if that is a concern.
research:
  sources: [wiktionary, etymonline, wikipedia]
  timeoutMs: 6000
  maxCharsPerSource: 4000
  # Wikimedia asks API clients to identify themselves.
  userAgent: EtymologyBot/1.0 (https://github.com/vovka/etymology_bot)

cache:
  enabled: true
  ttlSeconds: 2592000 # 30 days

rateLimit:
  requestsPerUserPerHour: 20

query:
  maxWords: 3
  maxLength: 60

reply:
  defaultLanguage: en
