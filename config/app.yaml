# Application config. Secrets never go here — only names of env vars that hold them.

# Providers the chain can use. Any OpenAI-compatible API needs only a new entry here.
providers:
  openrouter:
    type: openai-compatible
    baseUrl: https://openrouter.ai/api/v1
    apiKeyEnv: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: https://github.com/vovka/etymology_bot
      X-Title: Etymology Bot
  groq:
    type: openai-compatible
    baseUrl: https://api.groq.com/openai/v1
    apiKeyEnv: GROQ_API_KEY

# Each tier has its own model chain, hourly limit and answer cache. Users without a database record are on free.
# A chain is tried top to bottom; a rate-limited model is skipped until its cooldown ends.
# Free model IDs change often: check https://openrouter.ai/models?max_price=0 and https://console.groq.com/docs/models
# Per entry, `temperature` overrides llm.temperature (null leaves it out of the request),
# and `maxSteps` overrides agent.maxSteps.
# A nested list inside a chain is flattened, so the paid chains reuse the free chain through the *freeChain alias.
tiers:
  free:
    # Writes straight from the dictionary sources, without the agent loop.
    agent: false
    requestsPerHour: 5
    modelChain: &freeChain
      - provider: groq
        model: openai/gpt-oss-120b
        maxSteps: 8
        extraBody:
          reasoning_effort: low
      - provider: openrouter
        model: google/gemma-4-31b-it:free
        maxSteps: 8
      - provider: groq
        model: openai/gpt-oss-20b
        maxSteps: 8
        extraBody:
          reasoning_effort: low
      - provider: openrouter
        model: nvidia/nemotron-3-super-120b-a12b:free
        maxSteps: 8
      - provider: openrouter
        model: google/gemma-4-26b-a4b-it:free
        maxSteps: 8
      - provider: openrouter
        model: nvidia/nemotron-3-ultra-550b-a55b:free
        maxSteps: 8
      - provider: openrouter
        model: poolside/laguna-s-2.1:free
        maxSteps: 8
      - provider: openrouter
        model: thinkingmachines/inkling:free
        maxSteps: 8
      - provider: openrouter
        model: nvidia/nemotron-3.5-lightning:free
        maxSteps: 8
      - provider: openrouter
        model: openrouter/free
        maxSteps: 8
  basic:
    agent: false
    requestsPerHour: 20
    priceStars: 100
    modelChain: &paidChain
      - provider: openrouter
        model: anthropic/claude-haiku-5.5
        # Claude Haiku 5.5 returns a 400 for any temperature other than its default.
        temperature: null
      - provider: openrouter
        model: openai/gpt-oss-120b
      - *freeChain
  premium:
    # Explores with research tools for a few rounds before writing.
    agent: true
    requestsPerHour: 30
    priceStars: 250
    modelChain: *paidChain

llm:
  # Per model call. The agent makes several calls; see agent.timeBudgetMs for the overall budget.
  requestTimeoutMs: 25000
  # Per call. Reasoning models spend part of it thinking, so leave room beyond the answer itself.
  maxTokens: 4000
  temperature: 0.3

# The agent loop: the model calls research tools (Wiktionary, Etymonline, Wikipedia in any language)
# for a few rounds, then writes. Keep research.timeoutMs + timeBudgetMs + 2 × llm.requestTimeoutMs under
# maxDuration (120s in vercel.json): a model that fails after the budget is spent is replaced by one that
# writes straight away from the sources found so far.
agent:
  maxSteps: 5
  maxToolCallsPerStep: 4
  timeBudgetMs: 45000

cooldown:
  # Used when the provider sends no Retry-After header. A chain entry may override with cooldownSeconds.
  defaultSeconds: 60
  # Used when the error says a daily quota is exhausted.
  dailyQuotaSeconds: 3600

# Reference sources fetched for the word before the agent starts, so answers cite real scholarship
# even from models without tool calling.
# Etymonline has no API: it is read from its web page, so drop it here if that is a concern.
research:
  sources: [wiktionary, etymonline, wikipedia]
  timeoutMs: 6000
  maxCharsPerSource: 4000
  # Wikimedia asks API clients to identify themselves.
  userAgent: EtymologyBot/1.0 (https://github.com/vovka/etymology_bot)

cache:
  enabled: true
  ttlSeconds: 2592000 # 30 days

query:
  maxWords: 3
  maxLength: 60

reply:
  defaultLanguage: en

# Where /support and /paysupport messages go; replies to them are relayed back to the user.
support:
  adminChatId: 434699468

# The word answered by the demo buttons under the greeting, once per tier (then served from the cache).
demo:
  word: salary
